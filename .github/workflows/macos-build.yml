name: macOS build

on:
  push:
    branches:
      - main
      - 'fix/**'
    paths:
      - 'dikta-macos/**'
      - '.github/workflows/macos-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'dikta-macos/**'
      - '.github/workflows/macos-build.yml'
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: dikta-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift build
        run: swift build

      - name: Swift test
        run: swift test

      - name: Build with xcodebuild
        run: |
          set -o pipefail
          xcodebuild -project Dikta.xcodeproj -scheme Dikta -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build

      # App target uses manual Developer ID signing; DiktaTests is automatic. Override both to ad-hoc so the test bundle can load into the host.
      # Gate on the log, not just the exit code: a green exit with zero "Executed N tests" (e.g. a
      # scheme/filter misconfiguration matching nothing) must fail the build the same as a real test failure.
      - name: xcodebuild test (ad-hoc signing)
        run: |
          set +e
          xcodebuild -project Dikta.xcodeproj -scheme Dikta -destination 'platform=macOS' test CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGNING_REQUIRED=NO 2>&1 | tee test-output.log
          TEST_EXIT=${PIPESTATUS[0]}
          set -e

          EXECUTED_LINE=$(grep -E 'Executed [0-9]+ test' test-output.log | tail -1 || true)
          EXECUTED_COUNT=$(echo "${EXECUTED_LINE}" | sed -E 's/.*Executed ([0-9]+) test.*/\1/')

          if [ -z "${EXECUTED_LINE}" ] || ! [[ "${EXECUTED_COUNT}" =~ ^[0-9]+$ ]] || [ "${EXECUTED_COUNT}" -eq 0 ]; then
            echo "::error::DiktaTests reported no 'Executed N tests' line with N > 0 — a green exit code cannot hide a suite that silently ran nothing."
            exit 1
          fi

          if [ "${TEST_EXIT}" -ne 0 ]; then
            echo "::error::DiktaTests failed — ${EXECUTED_LINE}"
            exit "${TEST_EXIT}"
          fi

          echo "DiktaTests passed — ${EXECUTED_LINE}"
