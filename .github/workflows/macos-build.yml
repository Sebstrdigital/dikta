name: macOS build

on:
  push:
    branches:
      - main
      - 'fix/**'
    paths:
      - 'dikta-macos/**'
      - '.github/workflows/macos-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'dikta-macos/**'
      - '.github/workflows/macos-build.yml'
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: dikta-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift build
        run: swift build

      - name: Swift test
        run: swift test

      - name: Build with xcodebuild
        run: |
          set -o pipefail
          xcodebuild -project Dikta.xcodeproj -scheme Dikta -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
