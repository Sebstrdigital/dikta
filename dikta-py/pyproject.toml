[project]
name = "dikta"
version = "0.1.0"
description = "Dikta — offline dictation and meeting debrief (cross-platform Python port)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "faster-whisper>=1.1",
    "av>=13",
    "numpy>=1.26",
    "httpx>=0.27",
    "PySide6>=6.7",
]

[project.scripts]
dikta = "dikta.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dikta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = ["real: needs model download or real audio; skipped unless DIKTA_REAL_STT=1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
